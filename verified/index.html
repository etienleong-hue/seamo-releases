<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seamo — Returning to app</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1C1C1E;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
    .card{max-width:400px;padding:48px 32px}
    h1{font-size:20px;font-weight:600;margin-bottom:8px}
    p{font-size:14px;color:#98989D;line-height:1.5;margin-bottom:24px}
    .btn{display:inline-block;padding:10px 28px;background:#fff;color:#1C1C1E;font-size:14px;font-weight:600;border:none;border-radius:8px;cursor:pointer;text-decoration:none;transition:background .15s}
    .btn:hover{background:#E5E5EA}
    .status{margin-top:16px;font-size:12px;color:#636366}
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign-in complete</h1>
    <p id="msg">Returning to Seamo…</p>
    <a class="btn" id="open-btn" href="seamo://oauth-callback" style="display:none">Open Seamo</a>
    <div class="status" id="status"></div>
  </div>
  <script>
    window.location.href='seamo://oauth-callback';
    setTimeout(function(){
      if(document.visibilityState!=='hidden'){
        document.getElementById('open-btn').style.display='inline-block';
        document.getElementById('msg').textContent='Click below if Seamo didn’t open automatically.';
        document.getElementById('status').textContent='You can close this tab after returning to the app.';
      }
    },2000);
  </script>
</body>
</html>
